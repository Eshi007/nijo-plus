<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NiJo Plus — Here for whatever's on your mind</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23f0742a%22/><text x=%2250%22 y=%2266%22 font-size=%2250%22 text-anchor=%22middle%22>🙂</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Fraunces for display, Inter for body/UI. Neither covers Devanagari or
       Malayalam, so Noto Sans in both scripts backs them up in the font stack. -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Malayalam:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone-frame">
    <div id="app"></div>
    <!-- the care card lives outside #app so re-rendering the conversation
         underneath never restarts its entrance animation -->
    <div id="overlay-root"></div>
    <div id="toast" class="toast" hidden></div>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
